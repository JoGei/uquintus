# SPDX-License-Identifier: Unlicense
package:
  name: uquintus

dependencies:
  fpnew:
    git: https://github.com/openhwgroup/cvfpu.git
    rev: 77811635cb7e8649f1d9484733ee6a0bdb44a0e6

sources:
  - target: all(cvfpu_verilator, verilator)
    files:
      - verif/sim/common/uqu_cvfpu.vlt
  - include_dirs:
      - src/uquintus
    files:
      - target: any(rtl, core_test)
        files:
          - src/uquintus/uqu_core.v
      - target: core_test
        include_dirs:
          - verif/common
        files:
          - verif/common/uqu_bpu_monitor.sv
          - verif/common/uqu_rvfi.sv
          - verif/common/uqu_rvfi_csrs.sv
          - verif/sim/core/uqu_rvfi_trace.sv
          - verif/sim/core/uqu_xif_trace.sv
          - verif/sim/core/uqu_fp_trace.sv
          - verif/sim/core/uqu_core_tb.sv
      - target: any(bpu_monitor, benchmark_stats)
        include_dirs:
          - verif/common
        files:
          - verif/common/uqu_bpu_monitor.sv
      - target: any(pipeline_ctrl, pipeline_ctrl_test, rtl, core_test)
        files:
          - src/uquintus/uqu_pipeline_ctrl.v
      - target: any(xif_ctrl, rtl, core_test)
        files:
          - src/uquintus/uqu_xif_ctrl.v
      - target: pipeline_ctrl_test

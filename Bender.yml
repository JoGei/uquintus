package:
  name: uquintus

sources:
  - include_dirs:
      - src/uquintus
    files:
      - target: any(hazard, rtl)
        files:
          - src/uquintus/uqu_hazard.v
      - target: any(decode, branch_test, rtl)
        files:
          - src/uquintus/uqu_decoder.v
      - target: any(branch, branch_test, rtl)
        files:
          - src/uquintus/uqu_branch.v
      - target: branch_test
        files:
          - verif/sim/branch/uqu_branch_tb.v
      - target: any(arith, alu, alu_test, exec_arith_test, muldiv, muldiv_test, ex, ex_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_arith.v
      - target: any(muldiv, muldiv_test, exec_arith_test, ex, ex_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_muldiv.v
      - target: any(alu, alu_test, exec_arith_test, ex, ex_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_alu.v
      - target: any(fpu, ex, ex_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_fpu.v
      - target: any(ex, ex_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_stage_ex.v
      - target: ex_pipeline_test
        files:
          - verif/sim/ex_pipeline/uqu_ex_pipeline_tb.v
      - target: any(lsu, mem, mem_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_lsu.v
      - target: any(mem, mem_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_stage_mem.v
      - target: mem_pipeline_test
        files:
          - verif/sim/mem_pipeline/uqu_mem_pipeline_tb.v
      - target: any(csregfile, wb, wb_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_csregfile.v
      - target: any(wb, wb_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_stage_wb.v
      - target: wb_pipeline_test
        files:
          - verif/sim/wb_pipeline/uqu_wb_pipeline_tb.v
      - target: any(pmp, mem_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_pmp.v
      - target: alu_test
        files:
          - verif/sim/alu/uqu_alu_tb.v
      - target: exec_arith_test
        files:
          - verif/sim/exec_arith/uqu_exec_arith_tb.v
      - target: muldiv_test
        files:
          - verif/sim/muldiv/uqu_muldiv_tb.v
      - target: any(gpregfile, wb_pipeline_test, rtl)
        files:
          - src/uquintus/uqu_gpregfile.v
